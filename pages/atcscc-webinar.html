<body class="nass-page">
  <div id="utility-header"></div>
  <header class="faa-header">
    <div class="faa-brand">
      <img src="../assets/images/faa-insignia.svg" alt="" class="faa-insignia">
      <span>Federal Aviation<br>Administration</span>
    </div>
    <nav class="faa-header-nav" aria-label="FAA navigation">
      <a href="../index.html">Directory</a>
      <a href="tfr.html">NOTAMs</a>
      <a href="nass.html" aria-current="page">NASS</a>
    </nav>
  </header>

  <!-- NAS Status title strip: static, no menu links -->
  <div class="nass-title-strip">
    <h1>National Airspace System Status</h1>
    <time id="nass-utc-clock" class="nass-utc-clock" aria-label="Current UTC time">Current: -- UTC+0</time>
  </div>

<main class="nass-main atcscc-webinar-main">
  <h2>ATCSCC Advisories</h2>
  <div class="nass-separator"></div>
  <div class="atcscc-webinar-wrap">
    <div class="atcscc-webinar-back"><a href="nass.html">&lt; Advisory Webinars</a></div>
    <article id="atcscc-webinar-document" class="atcscc-webinar-document" aria-label="ATCSCC Operations Plan" hidden>
      <div id="atcscc-webinar-header-title" class="atcscc-webinar-head">ATCSCC Advisory</div>
      <div id="atcscc-webinar-title" class="atcscc-webinar-subhead"></div>
      <div class="atcscc-webinar-rawline"><strong>RAW TEXT:</strong><span>EVENT TIME: <span id="atcscc-webinar-event-time"></span> - AND LATER</span></div>
      <hr class="atcscc-webinar-rule">
      <div id="atcscc-webinar-description" class="atcscc-webinar-text"></div>
      <hr class="atcscc-webinar-rule">
      <div id="atcscc-webinar-operations" class="atcscc-webinar-text"></div>
      <hr class="atcscc-webinar-rule">
      <div class="atcscc-webinar-next-title">NEXT PLANNING WEBINAR: <span id="atcscc-webinar-next-time"></span></div>
      <div id="atcscc-webinar-next-text" class="atcscc-webinar-text atcscc-webinar-next-text"></div>
      <hr class="atcscc-webinar-rule">
    </article>
  </div>
</main>
  <footer class="tfr-footer">Stormworks only - not for public use · For game simulation only - not real</footer>
