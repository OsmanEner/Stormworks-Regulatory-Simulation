<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>License Search — Federal Communications Commission (Simulation)</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/sr-favicon.svg?v=28">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/sr-favicon-32.png?v=28">
  <link rel="shortcut icon" href="../assets/images/favicon.ico?v=28">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/sr-favicon-180.png?v=28">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script defer src="../assets/js/shared-header.js"></script>
  <script defer src="../data/fcc-license-records.js"></script>
  <script defer src="../assets/js/fcc-licenses.js"></script>
</head>
<body class="fcc-page">
  <div id="utility-header"></div>
  <header class="fcc-header">
    <div class="fcc-brand">
      <img src="../assets/images/fcc-emblem.svg" alt="" class="fcc-insignia">
      <span class="agency-brand-label">Federal Communications Commission<br>Simulation</span>
    </div>
    <nav class="fcc-header-nav" aria-label="FCC navigation">
      <a href="../index.html">Directory</a>
    </nav>
  </header>

  <main class="fcc-layout">
    <aside class="fcc-filters" aria-label="License search filters">
      <div class="fcc-search-caption">Open License Search</div>
      <div class="fcc-filter-inner">
        <div class="fcc-field">
          <label for="fcc-licensee">Licensee Name</label>
          <input id="fcc-licensee" type="text" autocomplete="off">
        </div>
        <div class="fcc-field">
          <label for="fcc-type">License Type</label>
          <select id="fcc-type">
            <option value="">- Please select a License Type -</option>
            <option value="Regular">Regular</option>
            <option value="Experimental">Experimental</option>
            <option value="STA">Special Temporary Authority (STA)</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="fcc-field">
          <label for="fcc-state">State</label>
          <select id="fcc-state">
            <option value="TX" selected>Texas</option>
          </select>
        </div>
        <div class="fcc-field">
          <label for="fcc-status">Status</label>
          <select id="fcc-status">
            <option value="">- Please select a Status -</option>
            <option value="Active">Active</option>
            <option value="Granted">Granted</option>
            <option value="Pending">Pending</option>
            <option value="Expired">Expired</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
        <div class="fcc-field fcc-query-field">
          <label for="fcc-query">Type to Search</label>
          <input id="fcc-query" type="search" placeholder="Type to search..." autocomplete="off">
        </div>
      </div>
      <div class="fcc-data-links">
        <a href="#" id="fcc-json">License List in JSON</a>
        <a href="#" id="fcc-xml">License List in XML</a>
      </div>
    </aside>

    <section class="fcc-results" aria-label="FCC license records">
      <div class="fcc-info-bar">
        <span>Total Records: <strong id="fcc-total">0</strong></span>
        <span>Data as of: <strong id="fcc-as-of">—</strong></span>
      </div>
      <div class="fcc-table-wrap">
        <table class="fcc-table" aria-label="FCC radio license search results">
          <colgroup><col class="fcc-col-file"><col class="fcc-col-call"><col class="fcc-col-licensee"><col class="fcc-col-state"><col class="fcc-col-type"><col class="fcc-col-status"><col class="fcc-col-details"></colgroup>
          <thead><tr>
            <th scope="col" data-sort="fileNumber"><button type="button">File Number <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
            <th scope="col" data-sort="callSign"><button type="button">Call Sign <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
            <th scope="col" data-sort="licensee"><button type="button">Licensee <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
            <th scope="col" data-sort="state"><button type="button">State <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
            <th scope="col" data-sort="type"><button type="button">Type <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
            <th scope="col" data-sort="status"><button type="button">Status <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
            <th scope="col" class="fcc-details-heading">Details</th>
          </tr></thead>
          <tbody id="fcc-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="fcc-footer">Stormworks only - not for public use · For game simulation only - not real</footer>
</body>
</html>
